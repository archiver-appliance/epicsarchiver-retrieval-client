
variables:
  CONTAINER_TEST_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME"
  TWINE_REPOSITORY_URL: https://artifactory.esss.lu.se/artifactory/api/pypi/ics-pypi
  TWINE_USERNAME: gitlab
  TWINE_PASSWORD: secret
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

default:
  tags:
    - docker

# Pip's cache doesn't store the python packages
# https://pip.pypa.io/en/stable/reference/pip_install/#caching
cache:
  paths:
    - .cache/pip

stages:
  - check
  - build
  - test
  - analyse
  - release
  - deploy


before_script:
  - python --version  # For debugging
  - pip install hatch
  
.parallel:
  parallel:
    matrix:
      - IMAGE: [python:3.10, python:3.11]

test:
  stage: test
  image: $IMAGE
  script:
    - hatch run test --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
  parallel: !reference [.parallel,parallel]


cov:
  stage: analyse
  image: $IMAGE
  script:
    - hatch run cov
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  parallel: !reference [.parallel,parallel]


lint:
  stage: check
  image: $IMAGE
  script:
    - hatch run style
  parallel: !reference [.parallel,parallel]


build:
  stage: build
  image: $IMAGE
  script:
    - hatch build
  artifacts:
    expire_in: 1 day
    paths:
      - dist/
  parallel: !reference [.parallel,parallel]


pages:
  stage: deploy
  image: python:3.10
  script:
    - hatch run docs
    - mv docs/build/html public
  artifacts:
    paths:
      - public
  only:
    - tags


release-pypi-package:
  stage: release
  image: $IMAGE
  before_script:
    - pip install twine
  script:
    - twine upload dist/*
  only:
    - tags
  parallel: !reference [.parallel,parallel]

