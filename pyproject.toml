[build-system]
build-backend = "hatchling.build"

requires = [ "hatch-vcs>=0.3", "hatchling>=1.24.2" ]

[project]
name = "py-epicsarchiver"
description = "A python script for managing and pulling data from the Archiver Appliance"
readme = "README.md"
keywords = [  ]
authors = [
  { name = "Sky Brewer", email = "sky.brewer@ess.eu" },
  { name = "Benjamin Bertrand" },
]
requires-python = ">=3.8"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dynamic = [ "version" ]

dependencies = [
  "aiohttp>=3",
  "asyncio>=3.4",
  "click>=8",
  "numpy>=1.24",
  "pandas>=2",
  "protobuf>=5",
  "pytz>=2024.1",
  "requests>=2",
  "rich>=13",
  "strictly-typed-pandas>=0.3",
]
urls.Source = "https://gitlab.esss.lu.se/ics-software/py-epicsarchiver"
scripts.epicsarchiver = "epicsarchiver.command:cli"

[tool.ruff]
extend = "ruff.toml"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "DEBUG"

[tool.coverage.run]
source_pkgs = [ "epicsarchiver", "tests" ]
branch = true
parallel = true
omit = [ "epicsarchiver/__about__.py" ]

[tool.coverage.paths]
epicsarchiver = [ "epicsarchiver", "*/py-epicsarchiver/epicsarchiver" ]
tests = [ "tests", "*/epicsarchiver/tests" ]

[tool.coverage.report]
exclude_lines = [ "no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:" ]
show_missing = true

[tool.mypy]
strict = true
