[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-epicsarchiver"
description = "A python script for managing and pulling data from the Archiver Appliance"
readme = "README.md"
requires-python = ">=3.8"
keywords = []
authors = [
  { name = "Sky Brewer", email = "sky.brewer@ess.eu" },
  { name = "Benjamin Bertrand" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy",
  "pandas",
  "requests",
  "rich",
  "click>=8",
  "protobuf",
  "strictly_typed_pandas",
  "pytz",
  "asyncio",
  "aiohttp",
]
dynamic = ["version"]

[project.scripts]
epicsarchiver = "epicsarchiver.command:cli"

[project.urls]
Source = "https://gitlab.esss.lu.se/ics-software/py-epicsarchiver"

[tool.ruff]
extend = "ruff_defaults.toml"
target-version = "py38"
line-length = 88
exclude = [
  "epicsarchiver/retrieval/EPICSEvent_pb2.py",
  "epicsarchiver/retrieval/EPICSEvent_pb2.pyi",
  "docs/source/conf.py",
]
preview = true

[tool.ruff.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252", "D", "SLF001", "INP001"]

[tool.ruff.pydocstyle]
# Use Google-style docstrings.
convention = "google"

[tool.mypy]
strict = true

[tool.coverage.run]
source_pkgs = ["epicsarchiver", "tests"]
branch = true
parallel = true
omit = ["epicsarchiver/__about__.py"]

[tool.coverage.paths]
epicsarchiver = ["epicsarchiver", "*/py-epicsarchiver/epicsarchiver"]
tests = ["tests", "*/epicsarchiver/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]
show_missing = true

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "DEBUG"
